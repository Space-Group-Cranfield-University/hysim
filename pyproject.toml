[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
    "wheel"]
build-backend = "setuptools.build_meta"


[project]
# Project Information
name = "hysim" # Required
version = "0.1.2"
description = "Hyperspectral Space-to-Space Imaging Simulator"
requires-python = ">=3.9"
authors = [
    {name = "Cameron Leslie", email= "cameron.f.leslie@cranfield.ac.uk"},
    {name = "Leonard Felicetti", email= "Leonard.Felicetti@cranfield.ac.uk"},
    {name = "Stephen Hobbs", email= "S.E.Hobbs@cranfield.ac.uk"},
    {name = "Samuel Rowling"},
]
maintainers = [
     {name = "Cameron Leslie", email= "cameron.f.leslie@cranfield.ac.uk"}
]
readme = "README.md"

classifiers=[
     "Development Status :: Pre-Alpha",
]

dependencies = [
    "numpy==1.23.5",
    "mitsuba==3.6.4",
    "rickle==1.2.3",
    "StrEnum==0.4.15",
    "spiceypy==5.1.2",
    "imageio==2.23.0",
    "pydantic==2.10.6",
]

[tool.mypy]
plugins = ['pydantic.mypy', "numpy.typing.mypy_plugin"]

[project.scripts]
hysim = "hysim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.distutils.bdist_wheel]
universal = true
